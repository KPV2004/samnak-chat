# Self-hosted stack: web (Caddy), server, postgres, redis, minio.
# Install steps: deploy/README.md. Run from the repository root:
#   cp .env.example .env
#   docker compose --env-file .env -f deploy/compose.prod.yml up -d --wait
# --env-file lets this file read POSTGRES_PASSWORD and PUBLIC_URL from .env.
name: samnak-prod

# Settings every server process reads. Values from ../.env come first; the
# environment block replaces the ones that name localhost, which is wrong
# inside containers, with the service names of this stack.
x-app: &app
  env_file: ../.env
  environment:
    HTTP_ADDR: ":8080"
    DATABASE_URL: postgres://samnak:${POSTGRES_PASSWORD:-samnak}@postgres:5432/samnak?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    # Browsers reach storage through Caddy on the public URL (see Caddyfile),
    # and links in emails point there too.
    S3_PUBLIC_ENDPOINT: ${PUBLIC_URL:-http://localhost}
    WEB_URL: ${PUBLIC_URL:-http://localhost}
    # Only Caddy reaches the server on this network, so its X-Forwarded-For is
    # believed and the rate limit counts real client addresses (NFR-07).
    TRUSTED_PROXIES: ${STACK_SUBNET:-172.28.0.0/24}

services:
  # Caddy: the built web app on /, the API on /api (including /api/v1/ws).
  # Only this service publishes ports. /metrics is never proxied.
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # DOMAIN from ../.env turns on automatic HTTPS (NFR-05).
    env_file: ../.env
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      server:
        condition: service_healthy

  # Runs the migrations of the enabled modules, then exits. The server starts only
  # after this completes successfully.
  migrate:
    build:
      context: ../apps/server
    entrypoint: ["/migrate"]
    restart: "no"
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: ../apps/server
    restart: unless-stopped
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Internal to the stack: not published, and its password is not read from
    # ../.env (see deploy/README.md).
    environment:
      POSTGRES_USER: samnak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samnak}
      POSTGRES_DB: samnak
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samnak -d samnak"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    # MINIO_ROOT_USER and MINIO_ROOT_PASSWORD come from ../.env and must match
    # S3_ACCESS_KEY and S3_SECRET_KEY there.
    env_file: ../.env
    environment:
      # The Bitnami image creates the bucket itself after its setup restart.
      MINIO_DEFAULT_BUCKETS: samnak
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  default:
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-172.28.0.0/24}

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
