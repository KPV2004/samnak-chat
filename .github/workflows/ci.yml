name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: apps/server
      # ubuntu-latest ships Docker, which testcontainers uses.
      - run: go test -race ./...

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # The committed OpenAPI spec and the TypeScript types generated from it must
  # match the server code. Run `make openapi` locally and commit the result.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make openapi
      - run: git diff --exit-code apps/server/api packages/core/src/api

  # PLT-12: the server starts with each module set, /healthz and /meta answer
  # for it, and a disabled module's route is 404. scripts/check-modules.sh does
  # the work and runs the same way on a laptop.
  modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: unset
            modules: unset
            enabled: notify
          - label: empty
            modules: ""
            enabled: ""
          - label: task
            modules: task
            enabled: task
          - label: approval
            modules: approval
            enabled: approval
          - label: helpdesk
            modules: helpdesk
            enabled: helpdesk
          - label: notify,task,approval
            modules: notify,task,approval
            enabled: notify,task,approval
          - label: notify,task,approval,helpdesk
            modules: notify,task,approval,helpdesk
            enabled: notify,task,approval,helpdesk
    name: modules ${{ matrix.label }}
    env:
      DATABASE_URL: postgres://samnak:samnak@localhost:5432/samnak?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: samnak
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      # The Postgres, Redis and MinIO that `make up` starts, with their health checks.
      - run: docker compose -f deploy/docker-compose.yml up -d --wait
      - run: bash scripts/check-modules.sh "${{ matrix.modules }}" "${{ matrix.enabled }}"
