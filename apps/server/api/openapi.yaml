components:
  schemas:
    AcceptInviteInputBody:
      additionalProperties: false
      properties:
        token:
          maxLength: 256
          type: string
      required:
        - token
      type: object
    AddMembersInputBody:
      additionalProperties: false
      properties:
        user_ids:
          items:
            type: string
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
      required:
        - user_ids
      type: object
    AddReactionInputBody:
      additionalProperties: false
      properties:
        emoji:
          description: One emoji, such as 👍. Plain text is rejected
          maxLength: 32
          minLength: 1
          type: string
      required:
        - emoji
      type: object
    ApiError:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorBody"
      required:
        - error
      type: object
    ApiErrorBody:
      additionalProperties: false
      properties:
        code:
          description: Machine-readable error code
          examples:
            - not_found
          type: string
        message:
          description: Human-readable description
          examples:
            - channel not found
          type: string
      required:
        - code
        - message
      type: object
    Attachment:
      additionalProperties: false
      properties:
        file_name:
          type: string
        id:
          type: string
        is_image:
          type: boolean
        mime_type:
          type: string
        size:
          format: int64
          type: integer
      required:
        - id
        - file_name
        - size
        - mime_type
        - is_image
      type: object
    AttachmentURLOutputBody:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
        url:
          description: Presigned download URL; opening it saves the file under its name
          type: string
      required:
        - url
        - expires_at
      type: object
    Channel:
      additionalProperties: false
      properties:
        archived_at:
          format: date-time
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        dm_user_ids:
          description: Members of a direct message, empty otherwise
          items:
            type: string
          type: array
        id:
          type: string
        last_read_seq:
          description: The caller's read position; 0 when not a member
          format: int64
          type: integer
        last_seq:
          format: int64
          type: integer
        member_count:
          format: int64
          type: integer
        mention_count:
          format: int64
          type: integer
        name:
          description: Empty for direct messages
          type: string
        topic:
          type: string
        type:
          enum:
            - public
            - private
            - dm
          type: string
        unread_count:
          format: int64
          type: integer
      required:
        - id
        - type
        - name
        - topic
        - last_seq
        - last_read_seq
        - unread_count
        - mention_count
        - member_count
        - dm_user_ids
        - archived_at
        - created_at
      type: object
    ChannelMember:
      additionalProperties: false
      properties:
        display_name:
          description: Empty when the auth module is unavailable
          type: string
        joined_at:
          format: date-time
          type: string
        user_id:
          type: string
      required:
        - user_id
        - display_name
        - joined_at
      type: object
    CreateChannelInputBody:
      additionalProperties: false
      properties:
        member_ids:
          description: Workspace members to add besides the caller
          items:
            type: string
          maxItems: 100
          type:
            - array
            - "null"
        name:
          description: 1 to 80 characters, unique in the workspace
          type: string
        topic:
          description: At most 250 characters
          type: string
        type:
          enum:
            - public
            - private
          type: string
      required:
        - type
        - name
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        name:
          description: Display name, 1 to 100 characters
          type: string
        slug:
          description: Unique, 3 to 40 characters of a-z, 0-9 and hyphen
          examples:
            - acme-team
          type: string
      required:
        - name
        - slug
      type: object
    CreateInviteInputBody:
      additionalProperties: false
      properties:
        email:
          description: Leave out for a link invite anyone can use once
          type: string
        role:
          enum:
            - admin
            - member
            - guest
          type: string
      required:
        - role
      type: object
    DeviceBody:
      additionalProperties: false
      properties:
        current:
          description: True for the device that sent this request
          type: boolean
        id:
          type: string
        last_seen_at:
          format: date-time
          type: string
        name:
          examples:
            - Firefox on Linux
          type: string
        platform:
          enum:
            - web
            - desktop
            - ios
            - android
          type: string
      required:
        - id
        - name
        - platform
        - last_seen_at
        - current
      type: object
    DevicesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/DeviceBody"
          type: array
      required:
        - items
      type: object
    EditMessageInputBody:
      additionalProperties: false
      properties:
        body:
          minLength: 1
          type: string
      required:
        - body
      type: object
    Invite:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        email:
          description: Null for a link invite
          type:
            - string
            - "null"
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        role:
          enum:
            - admin
            - member
            - guest
          type: string
        token:
          description: Shown once, when the invite is created
          type: string
      required:
        - id
        - email
        - role
        - expires_at
        - created_at
      type: object
    ListChannelsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Channel"
          type: array
      required:
        - items
      type: object
    ListInvitesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Invite"
          type: array
      required:
        - items
      type: object
    ListMembersOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ChannelMember"
          type: array
      required:
        - items
      type: object
    ListMembersOutputBody1:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Member"
          type: array
        next_cursor:
          description: Empty on the last page
          type: string
      required:
        - items
        - next_cursor
      type: object
    ListMessagesOutputBody:
      additionalProperties: false
      properties:
        has_more:
          description: More messages exist in the direction of the query
          type: boolean
        items:
          description: Ascending by seq; replies are included
          items:
            $ref: "#/components/schemas/Message"
          type: array
      required:
        - items
        - has_more
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Workspace"
          type: array
      required:
        - items
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        device_name:
          examples:
            - Firefox on Linux
          maxLength: 100
          minLength: 1
          type: string
        email:
          maxLength: 254
          type: string
        password:
          maxLength: 128
          type: string
        platform:
          enum:
            - web
            - desktop
            - ios
            - android
          type: string
      required:
        - email
        - password
        - device_name
        - platform
      type: object
    LogoutInputBody:
      additionalProperties: false
      properties:
        all_devices:
          description: Log out every device of the user, not only this one
          type: boolean
      type: object
    MarkReadInputBody:
      additionalProperties: false
      properties:
        seq:
          description: The newest seq the user has seen; a smaller value than before is ignored
          format: int64
          minimum: 0
          type: integer
      required:
        - seq
      type: object
    Member:
      additionalProperties: false
      properties:
        display_name:
          description: Empty when the auth module is unavailable
          type: string
        email:
          description: Empty when the auth module is unavailable
          type: string
        joined_at:
          format: date-time
          type: string
        role:
          enum:
            - owner
            - admin
            - manager
            - member
            - guest
          type: string
        status:
          enum:
            - active
            - deactivated
          type: string
        user_id:
          type: string
      required:
        - user_id
        - display_name
        - email
        - role
        - status
        - joined_at
      type: object
    Message:
      additionalProperties: false
      properties:
        attachments:
          items:
            $ref: "#/components/schemas/Attachment"
          type: array
        body:
          description: Empty once deleted
          type: string
        channel_id:
          type: string
        client_msg_id:
          type: string
        created_at:
          format: date-time
          type: string
        deleted_at:
          format: date-time
          type:
            - string
            - "null"
        edited_at:
          format: date-time
          type:
            - string
            - "null"
        fallback_text:
          type: string
        id:
          type: string
        kind:
          description: text, or a card kind such as approval.request
          type: string
        mentions:
          description: User IDs mentioned who are in the channel
          items:
            type: string
          type: array
        mentions_channel:
          type: boolean
        payload:
          description: Card payload; null for text
          type:
            - ""
            - "null"
        reactions:
          items:
            $ref: "#/components/schemas/Reaction"
          type: array
        reply_count:
          format: int64
          type: integer
        sender_id:
          type: string
        seq:
          format: int64
          type: integer
        thread_root_id:
          type:
            - string
            - "null"
      required:
        - id
        - channel_id
        - seq
        - sender_id
        - client_msg_id
        - kind
        - body
        - payload
        - fallback_text
        - thread_root_id
        - reply_count
        - attachments
        - reactions
        - mentions
        - mentions_channel
        - edited_at
        - deleted_at
        - created_at
      type: object
    MetaBody:
      additionalProperties: false
      properties:
        modules:
          description: Enabled modules in startup order
          examples:
            - - auth
              - chat
          items:
            type: string
          type: array
        name:
          examples:
            - samnak-chat
          type: string
        version:
          examples:
            - 0.0.0-dev
          type: string
      required:
        - name
        - version
        - modules
      type: object
    Notification:
      additionalProperties: false
      properties:
        body:
          type: string
        created_at:
          format: date-time
          type: string
        data:
          additionalProperties: {}
          description: Kind-specific fields for clients that know the kind
          type: object
        id:
          type: string
        kind:
          description: <module>.<name>, e.g. chat.mention
          type: string
        link:
          description: Web path to open, e.g. /chat/{channel_id}
          type: string
        read_at:
          format: date-time
          type:
            - string
            - "null"
        title:
          type: string
      required:
        - id
        - kind
        - title
        - body
        - link
        - data
        - read_at
        - created_at
      type: object
    NotificationsOutputBody:
      additionalProperties: false
      properties:
        has_more:
          description: There are older notifications behind the cursor
          type: boolean
        items:
          items:
            $ref: "#/components/schemas/Notification"
          type: array
      required:
        - items
        - has_more
      type: object
    OpenDMInputBody:
      additionalProperties: false
      properties:
        user_ids:
          description: The other people; the caller is added
          items:
            type: string
          maxItems: 8
          minItems: 1
          type:
            - array
            - "null"
      required:
        - user_ids
      type: object
    PresignedUpload:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
        headers:
          additionalProperties:
            type: string
          description: Send exactly these headers; the URL is signed for them
          type: object
        method:
          type: string
        url:
          description: Presigned URL; send the file bytes to it
          type: string
      required:
        - url
        - method
        - headers
        - expires_at
      type: object
    Reaction:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        emoji:
          type: string
        me:
          description: The viewer used this emoji. In a WebSocket event it is true for the recipient
          type: boolean
      required:
        - emoji
        - count
        - me
      type: object
    RefreshInputBody:
      additionalProperties: false
      properties:
        refresh_token:
          maxLength: 512
          minLength: 1
          type: string
      required:
        - refresh_token
      type: object
    RegisterInputBody:
      additionalProperties: false
      properties:
        display_name:
          examples:
            - Alice
          maxLength: 100
          minLength: 1
          type: string
        email:
          description: Trimmed and lower-cased; unique
          examples:
            - alice@example.com
          maxLength: 254
          type: string
        password:
          maxLength: 128
          minLength: 8
          type: string
      required:
        - email
        - password
        - display_name
      type: object
    SendMessageInputBody:
      additionalProperties: false
      properties:
        attachment_ids:
          description: Files from POST /chat/uploads that you uploaded to this channel; each can be used once
          items:
            type: string
          maxItems: 10
          type:
            - array
            - "null"
        body:
          description: Markdown, 1 to 4,000 characters; may be empty when attachment_ids is not. Mention people with <@user_id> and everyone with <!channel>
          type: string
        client_msg_id:
          description: Generated by the client; sending it again never creates a second message
          format: uuid
          type: string
        thread_root_id:
          description: Reply under this top-level message
          type: string
      required:
        - client_msg_id
        - body
      type: object
    TokenPairBody:
      additionalProperties: false
      properties:
        access_token:
          description: "JWT, send as Authorization: Bearer"
          type: string
        device_id:
          type: string
        expires_in:
          description: Seconds until the access token expires
          examples:
            - 900
          format: int64
          type: integer
        refresh_token:
          description: "Opaque, single use: every refresh returns a new one"
          type: string
        user:
          $ref: "#/components/schemas/UserBody"
      required:
        - access_token
        - refresh_token
        - expires_in
        - device_id
        - user
      type: object
    UnreadCountOutputBody:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
      required:
        - count
      type: object
    UpdateChannelInputBody:
      additionalProperties: false
      properties:
        archived:
          description: true archives the channel, false restores it
          type: boolean
        name:
          type: string
        topic:
          type: string
      type: object
    UpdateMeInputBody:
      additionalProperties: false
      properties:
        avatar_url:
          description: http or https URL; empty removes the avatar
          maxLength: 2048
          type: string
        display_name:
          maxLength: 100
          minLength: 1
          type: string
        locale:
          enum:
            - th
            - en
          type: string
        timezone:
          description: IANA name
          examples:
            - Asia/Bangkok
          type: string
      type: object
    UpdateMemberInputBody:
      additionalProperties: false
      properties:
        role:
          description: Only an owner may grant or change owner
          enum:
            - owner
            - admin
            - manager
            - member
            - guest
          type: string
        status:
          enum:
            - active
            - deactivated
          type: string
      type: object
    UploadInputBody:
      additionalProperties: false
      properties:
        channel_id:
          description: A channel the caller is in
          type: string
        file_name:
          maxLength: 1024
          minLength: 1
          type: string
        mime_type:
          examples:
            - image/png
          maxLength: 255
          minLength: 3
          type: string
        size:
          description: Bytes, at most 50 MB
          format: int64
          maximum: 52428800
          minimum: 1
          type: integer
      required:
        - channel_id
        - file_name
        - size
        - mime_type
      type: object
    UploadOutputBody:
      additionalProperties: false
      properties:
        attachment_id:
          description: Pass it in attachment_ids when sending a message
          type: string
        upload:
          $ref: "#/components/schemas/PresignedUpload"
          description: Upload with PUT before sending the message; expires after 15 minutes
      required:
        - attachment_id
        - upload
      type: object
    UserBody:
      additionalProperties: false
      properties:
        avatar_url:
          description: Empty when the user has no avatar
          examples:
            - https://cdn.example.com/a.png
          type: string
        created_at:
          format: date-time
          type: string
        display_name:
          examples:
            - Alice
          type: string
        email:
          examples:
            - alice@example.com
          type: string
        id:
          examples:
            - 0192f0c1-7b1e-7c3a-9d1e-5b6f4a3c2d10
          type: string
        locale:
          enum:
            - th
            - en
          type: string
        timezone:
          description: IANA name
          examples:
            - Asia/Bangkok
          type: string
      required:
        - id
        - email
        - display_name
        - avatar_url
        - locale
        - timezone
        - created_at
      type: object
    Workspace:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        role:
          enum:
            - owner
            - admin
            - manager
            - member
            - guest
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug
        - role
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: Samnak Chat API
  version: 0.0.0-dev
openapi: 3.1.0
paths:
  /auth/devices:
    get:
      operationId: auth-list-devices
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesOutputBody"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Devices that are logged in
      tags:
        - auth
  /auth/devices/{id}:
    delete:
      operationId: auth-revoke-device
      parameters:
        - description: Device ID
          in: path
          name: id
          required: true
          schema:
            description: Device ID
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Log one device out
      tags:
        - auth
  /auth/login:
    post:
      description: Five failed logins per minute per email and per IP are answered with 429.
      operationId: auth-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairBody"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal Server Error
      summary: Log in on a new device
      tags:
        - auth
  /auth/logout:
    post:
      operationId: auth-logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutInputBody"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Log out this device, or all of them
      tags:
        - auth
  /auth/me:
    get:
      operationId: auth-get-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBody"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal Server Error
      security:
        - bearer: []
      summary: The current user
      tags:
        - auth
    patch:
      operationId: auth-update-me
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBody"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Edit the profile
      tags:
        - auth
  /auth/refresh:
    post:
      description: The refresh token is single use. Sending a spent one revokes the whole device.
      operationId: auth-refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairBody"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
