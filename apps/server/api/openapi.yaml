components:
  schemas:
    AcceptInviteInputBody:
      additionalProperties: false
      properties:
        token:
          maxLength: 256
          type: string
      required:
        - token
      type: object
    AddMembersInputBody:
      additionalProperties: false
      properties:
        user_ids:
          items:
            type: string
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
      required:
        - user_ids
      type: object
    AddReactionInputBody:
      additionalProperties: false
      properties:
        emoji:
          description: One emoji, such as 👍. Plain text is rejected
          maxLength: 32
          minLength: 1
          type: string
      required:
        - emoji
      type: object
    ApiError:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorBody"
      required:
        - error
      type: object
    ApiErrorBody:
      additionalProperties: false
      properties:
        code:
          description: Machine-readable error code
          examples:
            - not_found
          type: string
        message:
          description: Human-readable description
          examples:
            - channel not found
          type: string
      required:
        - code
        - message
      type: object
    ApprovalAttachment:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        file_name:
          type: string
        id:
          description: Pass it to GET /approval/attachments/{id} for a download URL
          type: string
        mime_type:
          type: string
        size:
          format: int64
          type: integer
      required:
        - id
        - file_name
        - size
        - mime_type
        - created_at
      type: object
    ApprovalAttachmentURLOutputBody:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
        url:
          description: Presigned download URL; opening it saves the file under its name
          type: string
      required:
        - url
        - expires_at
      type: object
    ApprovalCreateInputBody:
      additionalProperties: false
      properties:
        approver_id:
          description: Defaults to the first manager of one of your groups; 400 approver_required when there is none
          type: string
        attachment_ids:
          description: Files from POST /approval/uploads that you uploaded; each can be used once
          items:
            type: string
          maxItems: 10
          type:
            - array
            - "null"
        payload:
          additionalProperties: {}
          description: "leave: {leave_type annual|sick|personal|other, start_date, end_date (YYYY-MM-DD, end not before start), half_day? morning|afternoon (one day only), reason (1-1000)}; general: {subject (1-200), details (up to 4000), amount? (decimal string like \"1200.50\"), currency? (default THB)}"
          type: object
        type:
          enum:
            - leave
            - general
          type: string
      required:
        - type
        - payload
      type: object
    ApprovalHistoryEntry:
      additionalProperties: false
      properties:
        action:
          enum:
            - created
            - approved
            - rejected
            - cancelled
          type: string
        actor_id:
          type: string
        at:
          format: date-time
          type: string
        id:
          type: string
        reason:
          type: string
      required:
        - id
        - actor_id
        - action
        - reason
        - at
      type: object
    ApprovalListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ApprovalRequest"
          type: array
        next_cursor:
          description: Empty on the last page
          type: string
      required:
        - items
        - next_cursor
      type: object
    ApprovalPresignedUpload:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
        headers:
          additionalProperties:
            type: string
          description: Send exactly these headers; the URL is signed for them
          type: object
        method:
          type: string
        url:
          description: Presigned URL; send the file bytes to it
          type: string
      required:
        - url
        - method
        - headers
        - expires_at
      type: object
    ApprovalRejectInputBody:
      additionalProperties: false
      properties:
        reason:
          description: 1 to 1000 characters
          type: string
      required:
        - reason
      type: object
    ApprovalRequest:
      additionalProperties: false
      properties:
        approver_id:
          type: string
        created_at:
          format: date-time
          type: string
        decided_at:
          description: When it was approved, rejected or cancelled
          format: date-time
          type:
            - string
            - "null"
        id:
          type: string
        message_id:
          description: The card in the requester-approver DM; null until it is posted
          type:
            - string
            - "null"
        payload:
          additionalProperties: {}
          description: "leave: {leave_type, start_date, end_date, half_day?, reason}; general: {subject, details, amount?, currency?}"
          type: object
        reason:
          description: Why the approver rejected it; empty otherwise
          type: string
        requester_id:
          type: string
        status:
          enum:
            - pending
            - approved
            - rejected
            - cancelled
          type: string
        type:
          enum:
            - leave
            - general
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - type
        - status
        - requester_id
        - approver_id
        - payload
        - reason
        - decided_at
        - created_at
        - updated_at
        - message_id
      type: object
    ApprovalRequestDetail:
      additionalProperties: false
      properties:
        approver_id:
          type: string
        attachments:
          items:
            $ref: "#/components/schemas/ApprovalAttachment"
          type: array
        created_at:
          format: date-time
          type: string
        decided_at:
          description: When it was approved, rejected or cancelled
          format: date-time
          type:
            - string
            - "null"
        history:
          description: Oldest first
          items:
            $ref: "#/components/schemas/ApprovalHistoryEntry"
          type: array
        id:
          type: string
        message_id:
          description: The card in the requester-approver DM; null until it is posted
          type:
            - string
            - "null"
        payload:
          additionalProperties: {}
          description: "leave: {leave_type, start_date, end_date, half_day?, reason}; general: {subject, details, amount?, currency?}"
          type: object
        reason:
          description: Why the approver rejected it; empty otherwise
          type: string
        requester_id:
          type: string
        status:
          enum:
            - pending
            - approved
            - rejected
            - cancelled
          type: string
        type:
          enum:
            - leave
            - general
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - history
        - attachments
        - id
        - type
        - status
        - requester_id
        - approver_id
        - payload
        - reason
        - decided_at
        - created_at
        - updated_at
        - message_id
      type: object
    ApprovalUploadInputBody:
      additionalProperties: false
      properties:
        file_name:
          maxLength: 1024
          minLength: 1
          type: string
        mime_type:
          examples:
            - application/pdf
          maxLength: 255
          minLength: 3
          type: string
        size:
          description: Bytes, at most 50 MB
          format: int64
          maximum: 52428800
          minimum: 1
          type: integer
      required:
        - file_name
        - size
        - mime_type
      type: object
    ApprovalUploadOutputBody:
      additionalProperties: false
      properties:
        attachment_id:
          description: Pass it in attachment_ids when submitting the request
          type: string
        upload:
          $ref: "#/components/schemas/ApprovalPresignedUpload"
          description: Upload with PUT before submitting; expires after 15 minutes
      required:
        - attachment_id
        - upload
      type: object
    Attachment:
      additionalProperties: false
      properties:
        file_name:
          type: string
        id:
          type: string
        is_image:
          type: boolean
        mime_type:
          type: string
        size:
          format: int64
          type: integer
      required:
        - id
        - file_name
        - size
        - mime_type
        - is_image
      type: object
    AttachmentURLOutputBody:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
        url:
          description: Presigned download URL; opening it saves the file under its name
          type: string
      required:
        - url
        - expires_at
      type: object
    AuditEntry:
      additionalProperties: false
      properties:
        action:
          enum:
            - invite.created
            - invite.revoked
            - member.updated
            - member.removed
            - group.created
            - group.updated
            - group.deleted
            - group.members_set
          type: string
        actor_id:
          type: string
        created_at:
          format: date-time
          type: string
        data:
          additionalProperties: {}
          description: "What the action changed, for example {\"role\": {\"from\": \"member\", \"to\": \"manager\"}}; an empty object when nothing more is recorded"
          type: object
        id:
          type: string
        target_id:
          type: string
        target_type:
          enum:
            - member
            - invite
            - group
          type: string
      required:
        - id
        - actor_id
        - action
        - target_type
        - target_id
        - data
        - created_at
      type: object
    Channel:
      additionalProperties: false
      properties:
        archived_at:
          format: date-time
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        dm_user_ids:
          description: Members of a direct message, empty otherwise
          items:
            type: string
          type: array
        id:
          type: string
        last_message:
          $ref: "#/components/schemas/LastMessage"
          description: The newest message, deleted ones included; null for an empty channel
        last_read_seq:
          description: The caller's read position; 0 when not a member
          format: int64
          type: integer
        last_seq:
          format: int64
          type: integer
        member_count:
          format: int64
          type: integer
        mention_count:
          format: int64
          type: integer
        name:
          description: Empty for direct messages
          type: string
        pinned_at:
          description: When the caller pinned the channel; null when not pinned
          format: date-time
          type:
            - string
            - "null"
        topic:
          type: string
        type:
          enum:
            - public
            - private
            - dm
          type: string
        unread_count:
          format: int64
          type: integer
      required:
        - id
        - type
        - name
        - topic
        - last_seq
        - last_read_seq
        - unread_count
        - mention_count
        - member_count
        - dm_user_ids
        - archived_at
        - pinned_at
        - last_message
        - created_at
      type: object
    ChannelMember:
      additionalProperties: false
      properties:
        avatar_url:
          description: Empty when the user has no avatar or the auth module is unavailable
          examples:
            - https://cdn.example.com/a.png
          type: string
        display_name:
          description: Empty when the auth module is unavailable
          type: string
        joined_at:
          format: date-time
          type: string
        user_id:
          type: string
      required:
        - user_id
        - display_name
        - avatar_url
        - joined_at
      type: object
    CommandInfo:
      additionalProperties: false
      properties:
        description:
          type: string
        module:
          type: string
        name:
          description: Without the slash
          type: string
        usage:
          description: For example /task <title> [@assignee]
          type: string
      required:
        - name
        - usage
        - description
        - module
      type: object
    CreateChannelInputBody:
      additionalProperties: false
      properties:
        member_ids:
          description: Workspace members to add besides the caller
          items:
            type: string
          maxItems: 100
          type:
            - array
            - "null"
        name:
          description: 1 to 80 characters, unique in the workspace
          type: string
        topic:
          description: At most 250 characters
          type: string
        type:
          enum:
            - public
            - private
          type: string
      required:
        - type
        - name
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        name:
          description: Display name, 1 to 100 characters
          type: string
        slug:
          description: Unique, 3 to 40 characters of a-z, 0-9 and hyphen
          examples:
            - acme-team
          type: string
      required:
        - name
        - slug
      type: object
    CreateInviteInputBody:
      additionalProperties: false
      properties:
        email:
          description: Leave out for a link invite anyone can use once
          type: string
        role:
          enum:
            - admin
            - member
            - guest
          type: string
      required:
        - role
      type: object
    CreateTaskRequest:
      additionalProperties: false
      properties:
        assignee_id:
          description: An active member who can read the channel
          type: string
        channel_id:
          description: The channel the task belongs to; the caller must be able to read it
          type: string
        description:
          maxLength: 4000
          type: string
        due_at:
          format: date-time
          type: string
        priority:
          description: Defaults to normal
          enum:
            - low
            - normal
            - high
          type: string
        source_message_id:
          description: The message the task was created from
          type: string
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - channel_id
        - title
      type: object
    DeviceBody:
      additionalProperties: false
      properties:
        current:
          description: True for the device that sent this request
          type: boolean
        id:
          type: string
        last_seen_at:
          format: date-time
          type: string
        name:
          examples:
            - Firefox on Linux
          type: string
        platform:
          enum:
            - web
            - desktop
            - ios
            - android
          type: string
      required:
        - id
        - name
        - platform
        - last_seen_at
        - current
      type: object
    DevicesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/DeviceBody"
          type: array
      required:
        - items
      type: object
    EditMessageInputBody:
      additionalProperties: false
      properties:
        body:
          minLength: 1
          type: string
      required:
        - body
      type: object
    EmailTokenInputBody:
      additionalProperties: false
      properties:
        token:
          description: The token from the link in the mail
          maxLength: 512
          minLength: 1
          type: string
      required:
        - token
      type: object
    ExtensionsOutputBody:
      additionalProperties: false
      properties:
        commands:
          items:
            $ref: "#/components/schemas/CommandInfo"
          type: array
        message_actions:
          items:
            $ref: "#/components/schemas/MessageActionInfo"
          type: array
      required:
        - commands
        - message_actions
      type: object
    ForgotInputBody:
      additionalProperties: false
      properties:
        email:
          description: Answered with 204 whether or not the account exists
          maxLength: 254
          type: string
      required:
        - email
      type: object
    Group:
      additionalProperties: false
      properties:
        id:
          type: string
        manager_ids:
          description: In the order they became managers
          items:
            type: string
          type: array
        member_count:
          format: int64
          type: integer
        name:
          type: string
      required:
        - id
        - name
        - member_count
        - manager_ids
      type: object
    GroupMember:
      additionalProperties: false
      properties:
        display_name:
          description: Empty when the auth module is unavailable
          type: string
        is_manager:
          type: boolean
        user_id:
          type: string
      required:
        - user_id
        - display_name
        - is_manager
      type: object
    GroupNameBody:
      additionalProperties: false
      properties:
        name:
          description: 1 to 100 characters, unique in the workspace ignoring case
          type: string
      required:
        - name
      type: object
    HelpdeskAttachment:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        file_name:
          type: string
        from_message:
          description: Copied from the source chat message
          type: boolean
        id:
          type: string
        mime_type:
          type: string
        size:
          format: int64
          type: integer
      required:
        - id
        - file_name
        - size
        - mime_type
        - from_message
        - created_at
      type: object
    HelpdeskAttachmentURLOutputBody:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
        url:
          description: Presigned download URL; opening it saves the file under its name
          type: string
      required:
        - url
        - expires_at
      type: object
    HelpdeskCategory:
      additionalProperties: false
      properties:
        id:
          type: string
        is_default:
          description: The category new tickets from chat take; one per workspace
          type: boolean
        name:
          type: string
        queue_id:
          type: string
      required:
        - id
        - queue_id
        - name
        - is_default
      type: object
    HelpdeskCategoryCreateInputBody:
      additionalProperties: false
      properties:
        is_default:
          description: Takes the default from the category that had it
          type: boolean
        name:
          description: 1 to 100 characters
          type: string
        queue_id:
          type: string
      required:
        - queue_id
        - name
      type: object
    HelpdeskCategoryUpdateInputBody:
      additionalProperties: false
      properties:
        archived:
          type: boolean
        is_default:
          type: boolean
        name:
          description: 1 to 100 characters
          type: string
        queue_id:
          description: Move the category to another active queue
          type: string
      type: object
    HelpdeskComment:
      additionalProperties: false
      properties:
        author_id:
          type: string
        body:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        internal:
          description: Only agents and admins see internal comments
          type: boolean
        ticket_id:
          type: string
      required:
        - id
        - ticket_id
        - author_id
        - body
        - internal
        - created_at
      type: object
    HelpdeskCommentInputBody:
      additionalProperties: false
      properties:
        body:
          description: 1 to 8000 characters
          type: string
        internal:
          description: Only agents and admins may write internal comments
          type: boolean
      required:
        - body
      type: object
    HelpdeskHistoryEntry:
      additionalProperties: false
      properties:
        action:
          enum:
            - created
            - assigned
            - status_changed
            - priority_changed
            - category_changed
            - commented
          type: string
        actor_id:
          type: string
        at:
          format: date-time
          type: string
        from:
          description: The value before the change; empty when there was none
          type: string
        id:
          type: string
        internal:
          description: Only agents and admins see internal lines
          type: boolean
        to:
          description: The value after the change
          type: string
      required:
        - id
        - actor_id
        - action
        - from
        - to
        - internal
        - at
      type: object
    HelpdeskPresignedUpload:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
        headers:
          additionalProperties:
            type: string
          description: Send exactly these headers; the URL is signed for them
          type: object
        method:
          type: string
        url:
          description: Presigned URL; send the file bytes to it
          type: string
      required:
        - url
        - method
        - headers
        - expires_at
      type: object
    HelpdeskQueue:
      additionalProperties: false
      properties:
        agent_ids:
          items:
            type: string
          type: array
        categories:
          items:
            $ref: "#/components/schemas/HelpdeskCategory"
          type: array
        channel_id:
          description: The agents' channel; null when the queue has none
          type:
            - string
            - "null"
        id:
          type: string
        name:
          type: string
        prefix:
          description: The ticket key prefix, e.g. IT for IT-0142
          type: string
      required:
        - id
        - name
        - prefix
        - channel_id
        - agent_ids
        - categories
      type: object
    HelpdeskQueueAgentsInputBody:
      additionalProperties: false
      properties:
        user_ids:
          description: The new agents; an empty list removes them all
          items:
            type: string
          type: array
      required:
        - user_ids
      type: object
    HelpdeskQueueCreateInputBody:
      additionalProperties: false
      properties:
        channel_id:
          description: The agents' channel; new tickets of this queue get a card there
          type: string
        name:
          description: 1 to 100 characters
          type: string
        prefix:
          description: 2 to 6 letters A to Z, unique in the workspace; stored upper case
          type: string
      required:
        - name
        - prefix
      type: object
    HelpdeskQueueUpdateInputBody:
      additionalProperties: false
      properties:
        archived:
          description: true hides the queue and its categories; false restores it
          type: boolean
        channel_id:
          description: null clears the channel
          type:
            - string
            - "null"
        name:
          description: 1 to 100 characters
          type: string
      type: object
    HelpdeskQueuesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/HelpdeskQueue"
          type: array
      required:
        - items
      type: object
    HelpdeskTicket:
      additionalProperties: false
      properties:
        assignee_id:
          description: null until an agent claims or is assigned the ticket
          type:
            - string
            - "null"
        category_id:
          type: string
        closed_at:
          format: date-time
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          type: string
        key:
          description: The queue prefix and the number, e.g. IT-0142
          type: string
        message_id:
          description: The card in the requester's channel; null until it is posted
          type:
            - string
            - "null"
        number:
          format: int64
          type: integer
        priority:
          enum:
            - low
            - normal
            - high
            - urgent
          type: string
        queue_id:
          type: string
        requester_id:
          type: string
        resolved_at:
          format: date-time
          type:
            - string
            - "null"
        source_channel_id:
          description: The channel of the message the ticket was made from
          type:
            - string
            - "null"
        source_message_id:
          type:
            - string
            - "null"
        status:
          enum:
            - new
            - open
            - in_progress
            - waiting
            - resolved
            - closed
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - key
        - number
        - queue_id
        - category_id
        - title
        - description
        - requester_id
        - assignee_id
        - status
        - priority
        - source_channel_id
        - source_message_id
        - message_id
        - resolved_at
        - closed_at
        - created_at
        - updated_at
      type: object
    HelpdeskTicketAssignInputBody:
      additionalProperties: false
      properties:
        assignee_id:
          description: An agent of the queue; an agent may only name themselves
          type: string
      required:
        - assignee_id
      type: object
    HelpdeskTicketCreateInputBody:
      additionalProperties: false
      properties:
        attachment_ids:
          description: Files from POST /helpdesk/uploads that you uploaded; each can be used once
          items:
            type: string
          maxItems: 10
          type:
            - array
            - "null"
        category_id:
          description: The category; its queue takes the ticket
          type: string
        description:
          description: Up to 8000 characters; with source_message_id and no description, the message body
          type: string
        priority:
          description: Defaults to normal
          enum:
            - low
            - normal
            - high
            - urgent
          type: string
        source_message_id:
          description: A chat message you can read; needs chat
          type: string
        title:
          description: 1 to 200 characters
          type: string
      required:
        - category_id
        - title
      type: object
    HelpdeskTicketDetail:
      additionalProperties: false
      properties:
        assignee_id:
          description: null until an agent claims or is assigned the ticket
          type:
            - string
            - "null"
