info:
  title: Samnak Chat API
  version: 0.0.0-dev
openapi: 3.1.0
paths:
  /approval/attachments/{id}:
    get:
      operationId: approval-get-attachment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalAttachmentURLOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      security:
        - bearer: []
      summary: Get a presigned download URL for a file of a request
      tags:
        - approval
  /approval/requests:
    get:
      operationId: approval-list-requests
      parameters:
        - description: "requester: my requests; approver: waiting for me. Both when omitted"
          explode: false
          in: query
          name: role
          schema:
            description: "requester: my requests; approver: waiting for me. Both when omitted"
            enum:
              - requester
              - approver
            type: string
        - description: "Comma-separated: pending, approved, rejected, cancelled"
          explode: false
          in: query
          name: status
          schema:
            description: "Comma-separated: pending, approved, rejected, cancelled"
            type: string
        - description: next_cursor of the previous page
          explode: false
          in: query
          name: cursor
          schema:
            description: next_cursor of the previous page
            type: string
        - description: Page size
          explode: false
