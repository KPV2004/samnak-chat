version: "2"
sql:
  - engine: postgresql
    schema: ../../migrations/auth
    queries: queries
    gen:
      go:
        package: sqlcgen
        out: sqlcgen
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type: string
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
